name: CI - Playwright UI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  php-checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring,openssl,pdo_mysql

      - name: Wait for MySQL
        run: |
          for i in {1..20}; do mysql -h127.0.0.1 -uroot -proot -e 'select 1' && break || sleep 1; done

      - name: Create test database
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS eoffice_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Import SQL schema
        run: mysql -h127.0.0.1 -uroot -proot eoffice_test < database/eoffice.sql || true

      - name: PHP lint (non-failing)
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l || true

      - name: Run programmatic smoke E2E (non-failing)
        run: php tools/e2e_test.php || true

  playwright-ui:
    needs: php-checks
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring,openssl,pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node deps
        working-directory: tests/playwright
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: tests/playwright
        run: npx playwright install --with-deps

      - name: Wait for MySQL (playwright job)
        run: |
          for i in {1..30}; do mysql -h127.0.0.1 -uroot -proot -e 'select 1' && break || sleep 1; done

      - name: Create app database (playwright job)
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS eoffice CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Import SQL schema (playwright job)
        run: mysql -h127.0.0.1 -uroot -proot eoffice < database/eoffice.sql || true

      - name: Seed DB for UI tests
        run: |
          php tools/e2e_test.php || true
          php tools/seed_menunggu.php || true

      - name: Start PHP built-in server
        env:
          EOFFICE_BASE_URL: http://127.0.0.1:8080
          EOFFICE_DISABLE_CSRF: '1'
        run: |
          nohup php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in {1..30}; do curl -sSf http://127.0.0.1:8080/ && break || sleep 1; done

      - name: Run Playwright tests
        working-directory: tests/playwright
        env:
          EOFFICE_BASE_URL: http://127.0.0.1:8080
          EOFFICE_DISABLE_CSRF: '1'
        run: npx playwright test --reporter=list
